# Slides for the presentation on the home page, in order. Built from docs/presentation-prompt.md.
# Rules: one message per slide, title states the message, max ~30 words of text, max 4 items.
# Fields: style (photo | image | pillars | timeline | big | chips | numbers | default), kicker, title,
#         text, points, numbers [{value,label}], steps [{years,place}], big {value,label}, chips,
#         image, link, link_text. Each slide stays on screen long enough to read its words.

- style: photo
  kicker: Fernando Auat Cheein
  title: Robots and AI that farmers can trust
  text: Professor of Engineering and Director of the Harper Institute of Technology, Harper Adams University, UK.
  image: /assets/img/profile.jpg

- style: image
  kicker: Why it matters
  title: Farm machines must see, decide and stay safe
  text: We build perception, autonomy and safety assurance for robots working in real orchards, fields and farms.
  image: /assets/img/robot-apple.jpg

- style: pillars
  kicker: How we work
  title: Three pillars, one goal
  points:
    - "Digital Twinning: live models of machines, crops and fields"
    - "Artificial Intelligence: perception that works outdoors"
    - "Robotics: autonomous vehicles and manipulators"

- style: timeline
  kicker: Career
  title: Two decades, three countries
  steps:
    - { years: "2002–2011", place: "San Juan, Argentina · MSc, PhD, postdoc" }
    - { years: "2011–2026", place: "UTFSM, Chile · up to full professor" }
    - { years: "2022–2024", place: "Heriot-Watt and National Robotarium, UK" }
    - { years: "2024–", place: "Harper Adams, UK · Director, HIT" }

- style: default
  kicker: Research now
  title: From orchards to food quality
  points:
    - "SLAM for legged robots in orchards"
    - "Selective laser weeding"
    - "Spectral sensing of crop water stress"
    - "Safety certification (ISO 18497, ISO 25119)"
  link: /research/
  link_text: Explore the research

- style: big
  kicker: Invention
  title: Ideas protected, ideas used
  big: { value: "24", label: "patent publications in the US, Europe and Latin America" }
  points:
    - "Granted: US 10,464,229 B2 · US 12,158,015 B2 · EP 3 272 478 B1"
    - "Five IEEE Chile national innovation awards"

- style: chips
  kicker: Industry uptake
  title: Industry builds on our research
  big: { value: "11", label: "patents by companies and universities cite our work" }
  chips: [Honda, Sony, Stiga, Agreenculture, University of California, Florida A&M]

- style: chips
  kicker: Policy impact
  title: Our research informs policy
  big: { value: "22", label: "policy documents cite our work worldwide" }
