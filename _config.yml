# ------------------------------------------------------------------
#  Site settings — edit these first
# ------------------------------------------------------------------
title: Fernando Auat Cheein
tagline: Professor of Engineering · Director, Harper Institute of Technology
description: >-
  Agricultural robotics, AI perception, autonomous systems, digital twins
  and safety certification for autonomous agricultural machinery.

# If your repository is named  <username>.github.io  leave baseurl empty.
# If it has any other name (e.g. "website"), set baseurl: "/website"
url: "https://fauatcheein.github.io"
baseurl: "/fauatcheein"   # repo is named "fauatcheein". If you rename it to fauatcheein.github.io, set this to ""

author:
  name: Fernando Auat Cheein
  email: "fauat [at] harper [hyphen] adams [dot] ac [dot] uk"     # shown on the Contact section
  affiliation: Harper Adams University, Newport, Shropshire, UK

# Profile links — delete any line you don't want shown
links:
  scholar: "https://scholar.google.com/citations?user=glxar60AAAAJ&hl=en&oi=ao"
  orcid: "https://orcid.org/0000-0002-6347-7696"
  linkedin: "https://www.linkedin.com/in/fernando-auat-cheein-30743a59"
  institution: "https://www.harper-adams.ac.uk"
  scopus: "https://www.scopus.com/authid/detail.uri?authorId=23049317700"

# Top navigation
nav:
  - { title: About, url: "/" }
  - { title: Research, url: "/research/" }
  - { title: Publications, url: "/publications/" }
  - { title: Team, url: "/team/" }
  - { title: Network, url: "/network/" }
  - { title: CV, url: "/cv/" }
  - { title: News, url: "/news/" }

# ------------------------------------------------------------------
#  Build settings (GitHub Pages supports these out of the box)
# ------------------------------------------------------------------
markdown: kramdown
permalink: /news/:year/:month/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts

# Preview image shown when the site is shared on LinkedIn, X, etc.
defaults:
  - scope: { path: "" }
    values:
      image: /assets/img/share.jpg

# ------------------------------------------------------------------
#  Visitor statistics
# ------------------------------------------------------------------
# GoatCounter (private dashboard: visits, countries, pages, referrers; no cookies).
# Sign up at https://www.goatcounter.com and put your site code here, e.g. "fauatcheein".
goatcounter: "fauatcheein"
